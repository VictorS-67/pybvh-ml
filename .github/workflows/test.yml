name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      # pybvh resolves from PyPI, never from a git checkout: the whole
      # point of this job is to prove the published pin (pybvh>=0.8.1,<0.9)
      # installs, which a local editable pybvh would mask.
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
    - name: Run tests
      run: pytest tests/ -v
    - name: Execute tutorial and gallery notebooks
      run: pytest --nbmake tutorials/ gallery/feature_gallery.ipynb -v

  # Catches broken links / cross-references before they reach the deploy
  # (docs.yml only runs on push to main).
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs,torch]"
    - name: Export gallery page
      run: python scripts/export_gallery.py
    - name: Build docs (strict)
      run: mkdocs build --strict
