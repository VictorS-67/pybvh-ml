name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      # Release ordering: pybvh-ml 0.5.0 pins pybvh>=0.8,<0.9, which
      # resolves from PyPI only once pybvh 0.8.0 ships. CI is expected
      # red until then (pybvh publishes first, then pybvh-ml).
      # Deliberately no git-install fallback — the red window is short
      # and a temporary install path would mask real resolver issues.
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
    - name: Run tests
      run: pytest tests/ -v
    - name: Execute tutorial and gallery notebooks
      run: pytest --nbmake tutorials/ gallery/feature_gallery.ipynb -v

  # Catches broken links / cross-references before they reach the deploy
  # (docs.yml only runs on push to main). Same pybvh-from-PyPI resolution
  # note as above.
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs,torch]"
    - name: Export gallery page
      run: python scripts/export_gallery.py
    - name: Build docs (strict)
      run: mkdocs build --strict
