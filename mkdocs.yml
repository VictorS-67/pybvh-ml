site_name: pybvh-ml
site_description: ML bridge layer for pybvh — tensor packing, augmentation, preprocessing, and PyTorch datasets for motion capture data
site_url: https://victors-67.github.io/pybvh-ml/
repo_url: https://github.com/VictorS-67/pybvh-ml
repo_name: VictorS-67/pybvh-ml

# docs/internal_logs/ is the gitignored internal development history — never
# part of the site, even from a local `mkdocs build` / `gh-deploy` where the
# directory exists on disk.
exclude_docs: |
  /internal_logs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            merge_init_into_class: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - User Guide:
    - Tensor Layouts & Packing: guide/tensor-layouts.md
    - Preprocessing Pipelines: guide/preprocessing.md
    - Runtime Augmentation: guide/augmentation.md
    - PyTorch Integration: guide/pytorch.md
    - Skeleton Graph Metadata: guide/skeleton-metadata.md
  - API Reference:
    - api/index.md
    - Packing (tensor layouts): api/packing.md
    - Augmentation: api/augmentation.md
    - Augmentation Pipeline: api/pipeline.md
    - Preprocessing & Normalization: api/preprocessing.md
    - Sequences (windows & sampling): api/sequences.md
    - Skeleton Metadata: api/skeleton.md
    - Representation Conversion: api/convert.md
    - Feature Metadata: api/metadata.md
    - PyTorch (datasets & collate): api/torch.md
  - Tutorials: tutorials.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
